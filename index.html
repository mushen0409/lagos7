<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>俊丹的拉各斯七日</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 布局：单列"夜班仓库"舞台。顶部状态条，中间一张大卡（选项/结果/结算），底部七日日记。刻意单一深色街机风，不跟随浅色主题 */
:root{
  --night:#141a2b; --panel:#1c2740; --panel-2:#22314f; --edge:#2f4266;
  --teal:#3fd0c9; --gold:#f2c14e; --rose:#ff7aa2; --leaf:#57c27a; --sky:#7fb2ff;
  --ink:#f3ecd8; --mute:#9aa6bd;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(63,208,201,.12),transparent 60%)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--panel);border:2px solid var(--edge);border-radius:8px;padding:10px 14px}
.brand{font-family:var(--display);font-size:20px;color:var(--gold);letter-spacing:.04em;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:11px;color:var(--mute);letter-spacing:.08em}
.days{display:flex;gap:4px;align-items:center}
.days i{width:12px;height:12px;border:2px solid var(--edge);border-radius:2px;display:block}
.days i.done{background:var(--teal);border-color:var(--teal)}
.days i.now{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,193,78,.25)}
.meters{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.meter b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:1ch}
.meter .dot{width:10px;height:10px;border-radius:2px}
.stage{background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--teal)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(30px,7vw,46px);color:var(--gold)}
h2{font-size:clamp(24px,5vw,32px)}
p{margin:0;max-width:62ch}
.lead{color:var(--mute)}
canvas.scene{display:block;width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;border:2px solid var(--edge);background:#0e1322}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.cards{grid-template-columns:minmax(0,1fr)}}
.choice{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:linear-gradient(180deg,var(--panel-2),#192338);border:2px solid var(--edge);border-radius:8px;padding:10px;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .25s ease;animation:deal .45s ease both}
.choice:nth-child(2){animation-delay:.08s}.choice:nth-child(3){animation-delay:.16s}
.choice:hover,.choice:focus-visible{transform:translateY(-4px);border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),0 8px 24px rgba(63,208,201,.18);outline:none}
.choice .no{position:absolute;top:8px;left:8px;width:22px;height:22px;display:grid;place-items:center;background:var(--gold);color:#2a2100;font-family:var(--display);font-size:15px;border-radius:3px}
.choice canvas{width:100%;aspect-ratio:16/9;image-rendering:pixelated;background:#101829;border-radius:4px;border:1px solid var(--edge)}
.choice .t{font-family:var(--display);font-size:22px;color:var(--gold);line-height:1.15}
.choice .d{font-size:13px;color:var(--mute);line-height:1.45}
.choice.abs .t{color:var(--rose)}
.choice.slack .t{color:var(--sky)}
.choice .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.cards.picked .choice{opacity:.25;transform:scale(.97)}
.cards.picked .choice.on{opacity:1;transform:scale(1.02);border-color:var(--gold)}
@keyframes deal{from{opacity:0;transform:translateY(14px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.result{display:flex;flex-direction:column;gap:12px;animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;padding:2px 8px;border-radius:3px;font-weight:600;white-space:nowrap}
.tag.wh{background:rgba(87,194,122,.18);color:var(--leaf)}
.tag.slack{background:rgba(127,178,255,.18);color:var(--sky)}
.tag.abs{background:rgba(255,122,162,.18);color:var(--rose)}
.btn{align-self:flex-start;font-family:var(--display);font-size:20px;background:var(--gold);color:#2a2100;border:0;border-radius:6px;padding:8px 20px;cursor:pointer;box-shadow:0 4px 0 #a37a1c;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a37a1c}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.title-badge{display:inline-flex;flex-direction:column;gap:2px;align-self:flex-start;border:3px solid var(--gold);border-radius:6px;padding:8px 16px;background:#2a2410;animation:pop .6s ease both}
.title-badge span{font-size:12px;letter-spacing:.14em;color:var(--mute)}
.title-badge b{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,44px);color:var(--gold);line-height:1.1}
.title-badge.abs{border-color:var(--rose);background:#2d1626}.title-badge.abs b{color:var(--rose)}
.title-badge.slack{border-color:var(--sky);background:#16223a}.title-badge.slack b{color:var(--sky)}
@keyframes pop{0%{opacity:0;transform:scale(.8) rotate(-3deg)}70%{transform:scale(1.04) rotate(1deg)}100%{opacity:1;transform:none}}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.bars .track{height:10px;background:#101829;border-radius:3px;overflow:hidden;border:1px solid var(--edge)}
.bars .track i{display:block;height:100%}
.bars em{font-style:normal;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.diary{background:var(--panel);border:2px solid var(--edge);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.diary h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline}
.diary h3 small{font-family:var(--body);font-size:12px;color:var(--mute)}
.diary ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.diary li{display:grid;grid-template-columns:4.2em auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--edge);font-size:14px}
.diary li:first-child{border-top:0}
.diary .dn{font-family:var(--display);font-size:16px;color:var(--mute);font-variant-numeric:tabular-nums}
.diary .tx{min-width:0}
.diary .tx b{font-weight:600}
.diary .tx span{color:var(--mute)}
.diary li.todo .tx{color:var(--mute)}
.diary li.now .dn{color:var(--gold)}
.wei{display:flex;gap:12px;align-items:center;background:#1a2236;border:2px dashed var(--sky);border-radius:8px;padding:8px 12px;animation:rise .4s .25s ease both}
.wei canvas{width:40px;height:60px;image-rendering:pixelated;flex:none;background:#101829;border-radius:4px}
.wei div{min-width:0;font-size:14px}
.wei b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--sky);display:block;line-height:1.2}
.foot{font-size:12px;color:var(--mute);text-align:center}
.diary summary{list-style:none;cursor:pointer}
.diary summary::-webkit-details-marker{display:none}
.diary:not([open]) h3 small::after{content:' · 点开看'}
@media (max-width:560px){
  body{padding-block:8px 16px;font-size:14px;line-height:1.55}
  .wrap{gap:10px}
  .hud{padding:8px 10px;gap:6px 12px}
  .brand{font-size:17px}.brand small{display:none}
  .meters{gap:10px;margin-left:0}
  .stage{padding:12px;gap:10px}
  h1{font-size:28px}h2{font-size:22px}
  .cards{gap:8px}
  .choice{flex-direction:row;align-items:center;padding:8px;gap:10px}
  .choice canvas{width:96px;flex:none}
  .choice .no{top:4px;left:4px;width:18px;height:18px;font-size:12px}
  .choice .t{font-size:18px}.choice .d{font-size:12px}.choice .txt{gap:2px}
  .choice:hover,.choice:focus-visible{transform:none}
  .wei{padding:6px 10px}.wei canvas{width:30px;height:45px}
  .btn{align-self:stretch;text-align:center}
  .diary{padding:8px 12px}.diary li{font-size:13px;padding:6px 0}
  .foot{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<main class="wrap">
  <header class="hud" aria-label="游戏状态">
    <div class="brand">拉各斯七日<small>传音 · 尼日利亚仓</small></div>
    <div class="days" id="days" aria-label="天数进度"></div>
    <div class="meters">
      <span class="meter"><i class="dot" style="background:var(--leaf)"></i>仓库<b id="mWh">0</b></span>
      <span class="meter"><i class="dot" style="background:var(--sky)"></i>摸鱼<b id="mSl">0</b></span>
      <span class="meter"><i class="dot" style="background:var(--rose)"></i>腹肌<b id="mAb">0</b></span>
    </div>
  </header>
  <section class="stage" id="stage" aria-live="polite"></section>
  <details class="diary" id="diaryBox" open>
    <summary><h3>七日日记 <small id="diaryCount">0/7</small></h3></summary>
    <ol id="diary"></ol>
  </details>
  <p class="foot">小仓大梦 · 番外篇。纯属虚构，如有雷同，那一定是腹肌太显眼。</p>
</main>

<script>

};
const CROWD=(()=>{const sk=['#6b3f2a','#e3b48c','#5a3322','#f0c8a8','#c48a5a','#4e2c1e','#e8b890','#7a4a30','#f5d2b8'],hr=['#111','#4a2e1a','#111','#6b4a2a','#1f140c','#111','#e8c45a','#111','#f2e2a0'],tp=['#f2c14e','#e85d75','#3fd0c9','#9b7bff','#57c27a','#ff9f43','#ffffff','#7fb2ff','#ff7aa2'];

const DAYS=[
 {when:'周一 · 入职第一天',opts:[
  {k:'wh',t:'看看货到了没',d:'系统显示柜子到港三天了，仓库说没见到',bg:'office',s:'追到卡在清关的柜子，港口官员说要给你铺面资源',
   r:'你打开系统一查，柜子到港三天了，清关卡在一张单证上。你给货代打了四个电话，下午柜子终于提出来了。帮忙打招呼的港口官员听说你想开云南菌子餐厅，说可以给你介绍维多利亚岛的铺面资源。伟子哥松了口气：“艺术家来了就是不一样。”'},
  {k:'slack',t:'去泻湖钓鱼',d:'同事说周一的鱼最好钓',bg:'lagoon',s:'钓到一条罗非鱼和一只拖鞋',

  {k:'abs',t:'去维多利亚岛夜店',d:'入职第一晚，必须见见世面',bg:'club',cast:['Emeka','Luca'],s:'左手 Emeka，右手意大利帅哥 Luca',

  {k:'slack',t:'飞去肯尼亚看动物',d:'马赛马拉，正赶上角马过河',bg:'kenya',s:'看角马过河，顺便聊出菌子餐厅的投资意向',

 {when:'周六 · 大促前夜',opts:[

    const pyr=(x,b,h,col)=>{for(let j=0;j<h;j++)R(x-j,b-h+j,j*2+1,1,col)};pyr(46,56,30,'#c9984a');pyr(92,56,24,'#d6a85a');pyr(130,56,14,'#c9984a');for(let j=0;j<30;j+=3)R(16+j,26+j,1,1,'#a87a34')},
  office(c){const R=px(c);R(0,0,160,62,'#4d5b78');R(0,62,160,28,'#3a3f52');R(98,8,46,30,'#9fd3ff');R(10,52,70,4,'#9b6b3d');R(34,38,24,15,'#1c2433');R(36,40,20,11,'#7fb2ff')},
  party(c){const R=px(c);R(0,0,160,62,'#5a3a48');R(0,62,160,28,'#8a5a3c');for(let x=0;x<160;x+=16)R(x,62,1,28,'#7a4a30');R(0,9,160,1,'#3a2a30');
    for(let x=4;x<160;x+=10)R(x,9+Math.round(Math.sin(x/9)*2),2,2,['#f2c14e','#ff7aa2','#3fd0c9'][x%3]);
    R(120,36,38,16,'#3fd0c9');R(120,32,38,6,'#2fb0a9');R(118,34,4,18,'#2fb0a9');R(156,34,4,18,'#2fb0a9');
    R(4,30,12,22,'#57c27a');R(8,52,4,10,'#6e4a28');
    R(18,58,32,4,'#c08552');R(22,50,22,8,'#2b2b2b');R(24,50,18,3,'#e83a2a');R(27,49,3,2,'#c08552');R(34,48,3,3,'#d4a373');R(39,49,3,2,'#c08552');
    R(28,40,1,7,'rgba(255,255,255,.4)');R(33,38,1,9,'rgba(255,255,255,.4)');R(38,41,1,6,'rgba(255,255,255,.4)')},
  market(c){const R=px(c);R(0,0,160,50,'#ffcf7a');R(0,50,160,40,'#c99a62');const cols=['#e85d75','#3fd0c9','#f2c14e','#57c27a','#9b7bff'];
    for(let i=0;i<5;i++){const x=4+i*32;for(let k=0;k<4;k++)R(x+k*7,18,7,8,cols[(i+k)%5]);R(x,26,28,2,'#6e4a28');R(x+1,28,2,24,'#6e4a28');R(x+25,28,2,24,'#6e4a28')}},
};
function scene(cv,bg,cast){cv.width=160;cv.height=90;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;BG[bg](c);cast&&cast(c)}

/* 每个选项的画面 */
function drawPick(cv,day,opt){
  scene(cv,opt.bg,c=>{
    if(opt.k==='abs'){
      const cast=opt.cast||[];
      if(opt.crowd){crowd(c);trio(c,cast[0],cast[1],day===6);return}
      if(cast.length>=2){trio(c,cast[0],cast[1],false);return}
      person(c,96,31,{...guyLook(cast[0]),reachL:true});
      person(c,80,32,{...JUN,dress:'#e85d75',blush:true});
      heart(c,88,14);heart(c,96,8,'#ffb3c9');
    }else if(opt.k==='slack'){
      if(opt.bg==='lagoon'){person(c,60,28,{...JUN,hat:'#e8c98a'});line(c,75,30,104,10,'#d6dbe6');line(c,104,10,108,52,'rgba(255,255,255,.7)');px(c)(106,52,4,2,'#ff7aa2')}
      else if(opt.bg==='seafish'){person(c,52,26,{...JUN,hat:'#e8c98a'});line(c,67,28,100,8,'#d6dbe6');line(c,100,8,124,44,'rgba(255,255,255,.7)')}
      else if(opt.bg==='redsea'){person(c,72,30,{...JUN,mask:true,top:'#2b3550',pants:'#2b3550'});for(let i=0;i<4;i++)px(c)(84+i*3,26-i*5,2,2,'rgba(255,255,255,.6)')}
      else if(opt.bg==='egypt'){const R=px(c);R(58,52,24,10,'#c08552');R(78,44,8,10,'#c08552');R(82,40,6,6,'#c08552');R(60,62,3,10,'#8a5a2b');R(76,62,3,10,'#8a5a2b');person(c,60,24,{...JUN,hat:'#e8c98a',shades:true})}
      else if(opt.bg==='kenya'){person(c,64,32,{...JUN,hat:'#e8c98a'});px(c)(76,40,6,4,'#1c2433');px(c)(82,41,2,2,'#7fb2ff')}
      else{person(c,62,32,{...JUN,shades:true,wave:true});box(c,82,54,10,8,'#e85d75');px(c)(86,52,2,2,'#1c2433')}
    }else{
      const R=px(c);
      if(opt.bg==='office'){R(38,42,3,8,'#57c27a');R(43,45,3,5,'#f2c14e');R(48,40,3,10,'#e85d75');person(c,62,32,{...JUN,top:'#57c27a',wave:day===6})}
      else if(opt.bg==='night'){c.fillStyle='rgba(127,178,255,.25)';c.beginPath();c.arc(108,50,14,0,7);c.fill();R(102,52,14,2,'#9aa6bd');R(104,44,10,8,'#7fb2ff');person(c,86,32,{...JUN,top:'#57c27a'})}
      else person(c,86,32,{...JUN,top:'#57c27a',wave:day===6});
    }
  });
}
function drawIcon(cv,k,bg){scene(cv,bg,c=>{const R=px(c);c.fillStyle='rgba(20,26,43,.35)';c.fillRect(0,0,160,90);
  if(k==='wh'){box(c,60,50,18,14);box(c,80,50,18,14);box(c,70,36,18,14)}
  if(k==='slack'){R(64,40,32,4,'#f3ecd8');R(78,44,4,22,'#f3ecd8');R(70,64,20,3,'#f3ecd8')}
  if(k==='abs'){heart(c,70,34);heart(c,82,42,'#ffb3c9');heart(c,60,46,'#ffb3c9')}
})}

/* 结算 */
const ENDINGS={
  abs:{title:'腹肌终结者',cls:'abs',text:n=>`七天里，你有 ${n} 个晚上泡在夜店、酒吧和约会里。本地男大、意大利游客、巴西冲浪手、法国摄影师，一个都没错过。最后 18 个男模站成两排，你在 C 位左拥右抱。尼日利亚仓的货发没发完不重要，重要的是整个拉各斯的腹肌都记住了你。伟子哥听说以后，连夜办了一张健身卡，第二天就没再去过。`},
  wh:{title:'东西非物流女王',cls:'',text:n=>`七天里你有 ${n} 天在盯数据。柜子追到了，呆滞清掉了，业务也被你治得服服帖帖。传音东西非物流从此流传着艺术家的传说。伟子哥说以后仓库就交给你了，他负责吃。`},
  slack:{title:'带薪环球旅行家',cls:'slack',text:n=>`七天里你有 ${n} 天不在仓库。护照上多了好几个章，鱼也钓了不少。路上还跟好几个大叔聊出了菌子餐厅的投资意向，名片收了一叠。伟子哥只在朋友圈里见过你，每条都点了赞，每条都评论了“带我”。`},
  mix:{title:'拉各斯平衡大师',cls:'',text:()=>`工作、玩耍、腹肌，你一样都没落下。顺便把伟子哥气了整整七天。这才是成年人的终极形态。`},
};
function ending(){const s=S.stats;if(s.abs>=4)return 'abs';const top=Object.entries(s).sort((a,b)=>b[1]-a[1])[0];return top[1]>=4?top[0]:'mix'}
function drawEnding(cv,key){
  cv.width=160;cv.height=90;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;const R=px(c);
  if(key==='abs'){
    R(0,0,160,90,'#2a1838');R(0,62,160,28,'#3b2350');for(let x=0;x<160;x+=8)R(x,62,4,1,'#5a3a78');
    R(0,0,12,62,'#8a1f3d');R(148,0,12,62,'#8a1f3d');for(let y=0;y<62;y+=6){R(4,y,1,4,'#6a1530');R(154,y,1,4,'#6a1530')}
    c.fillStyle='rgba(255,233,168,.16)';c.beginPath();c.moveTo(64,0);c.lineTo(96,0);c.lineTo(112,64);c.lineTo(48,64);c.fill();
    crowd(c);trio(c,'Luca','Emeka',true);
    [[24,12],[52,6],[100,8],[128,14],[78,4],[40,20],[118,22]].forEach(([x,y],i)=>heart(c,x,y,i%2?'#ffb3c9':'#ff7aa2'));
    stars(c,18,55);
  }else if(key==='wh'){BG.warehouse(c);person(c,104,33,WEIZI);for(let i=0;i<3;i++)box(c,70+i*10,54,10,8);box(c,75,46,10,8);box(c,85,46,10,8);box(c,80,38,10,8);person(c,78,6,{...JUN,top:'#57c27a',crown:true,wave:true});heart(c,60,20,'#f2c14e');heart(c,104,24,'#f2c14e')}
  else if(key==='slack'){BG.paris(c);person(c,62,32,{...JUN,shades:true,wave:true,hat:'#e8c98a'});box(c,80,52,12,10,'#e85d75');R(84,50,4,2,'#1c2433');[[30,10,'#57c27a'],[44,18,'#f2c14e'],[18,22,'#ff9f43']].forEach(([x,y,col])=>{R(x,y,10,7,col);R(x+2,y+2,6,3,'rgba(255,255,255,.5)')})}
  else{BG.market(c);person(c,72,31,{...JUN,wave:true});person(c,96,32,WEIZI);box(c,52,40,8,6);heart(c,96,20)}
}

/* ---------- 渲染 ---------- */
const $=id=>document.getElementById(id);
const stage=$('stage');
function hud(){
  const live=S.phase==='choose'||S.phase==='result';
  $('days').innerHTML=Array.from({length:7},(_,i)=>`<i class="${i<S.picks.length?'done':''}${live&&i===S.day&&i>=S.picks.length?' now':''}" title="第${i+1}天"></i>`).join('');
  $('mWh').textContent=S.stats.wh;$('mSl').textContent=S.stats.slack;$('mAb').textContent=S.stats.abs;
  $('diaryCount').textContent=`${S.picks.length}/7`;
  $('diary').innerHTML=DAYS.map((D,i)=>{const p=S.picks.find(x=>x.day===i);
    if(p){const o=D.opts[p.i];const K=KIND[o.k];return `<li><span class="dn">第${i+1}天</span><span class="tag ${K.cls}">${K.label}</span><span class="tx"><b>${o.t}</b> <span>${o.s}</span></span></li>`}
    const now=live&&i===S.day;return `<li class="todo${now?' now':''}"><span class="dn">第${i+1}天</span><span></span><span class="tx">${now?'今天还没决定':'还没到'}</span></li>`}).join('');
}
function render(){
  hud();
  ({title:renderTitle,choose:renderChoose,result:renderResult,end:renderEnd})[S.phase]();
}
function renderTitle(){
  stage.innerHTML=`<div class="eyebrow">传音 · 尼日利亚 · 拉各斯仓库</div>
    <h1>艺术家俊丹的拉各斯七日</h1>
    <canvas class="scene" id="cvTitle" aria-label="俊丹站在拉各斯的仓库里"></canvas>
    <p class="lead">艺术家俊丹要去拉各斯出差七天。领导伟子哥已经在门口等你了，手里还拿着一杯奶茶。每天早上抽一张卡，决定今天干点啥。七天后，拉各斯会给你一个称号。</p>
    <button class="btn" id="go">上班去</button>`;
  scene($('cvTitle'),'warehouse',c=>{person(c,64,32,{...JUN,wave:true});person(c,86,32,WEIZI);heart(c,80,16,'#f2c14e')});
  $('go').onclick=()=>{S.phase='choose';S.day=0;render();focusFirst()};
}
function renderChoose(){
  const D=DAYS[S.day];
  stage.innerHTML=`<div class="eyebrow">第 ${S.day+1} 天 · ${D.when}</div>
    <h2>你今天打算做啥？</h2>
    <div class="cards" id="cards">${D.opts.map((o,i)=>`<button class="choice ${o.k}" data-i="${i}"><span class="no">${i+1}</span><canvas data-i="${i}"></canvas><span class="txt"><span class="t">${o.t}</span><span class="d">${o.d}</span></span></button>`).join('')}</div>`;
  stage.querySelectorAll('.choice canvas').forEach(cv=>{const o=D.opts[+cv.dataset.i];drawIcon(cv,o.k,o.bg)});
  stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(+b.dataset.i,b));
}
function pick(i,btn){
  if(S.phase!=='choose')return;
  const o=DAYS[S.day].opts[i];
  $('cards').classList.add('picked');btn.classList.add('on');
  S.picks.push({day:S.day,i});S.stats[o.k]++;S.phase='result';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{render();const b=$('next');b&&b.focus({preventScroll:true})},reduce?0:420);
}
function renderResult(){
  const p=S.picks[S.picks.length-1];const o=DAYS[p.day].opts[p.i];const K=KIND[o.k];const last=p.day===6;
  stage.innerHTML=`<div class="result">
    <div class="eyebrow">第 ${p.day+1} 天 · ${o.t}</div>
    <canvas class="scene" id="cvRes" aria-label="${o.t}"></canvas>
    <div class="tagrow"><span class="tag ${K.cls}">${K.label} +1</span></div>
    <p>${o.r}</p>
    <div class="wei"><canvas id="cvWei" aria-hidden="true"></canvas><div><b>伟子哥今日</b>${WEI[p.day][o.k]}</div></div>
    <button class="btn" id="next">${last?'看看七天的结局':'睡觉，进入第 '+(p.day+2)+' 天'}</button></div>`;
  drawPick($('cvRes'),p.day,o);drawWei($('cvWei'));
  $('next').onclick=()=>{if(last)S.phase='end';else{S.day++;S.phase='choose'}render();focusFirst()};
}
function renderEnd(){
  const key=ending();const E=ENDINGS[key];const s=S.stats;
  const title=key==='abs'&&s.abs===7?'腹肌终结者 · 七天全勤':E.title;
  const row=(lab,v,col)=>`<span>${lab}</span><div class="track"><i style="width:${v/7*100}%;background:${col}"></i></div><em>${v}</em>`;
  stage.innerHTML=`<div class="result">
    <div class="eyebrow">七日结算 · 拉各斯授予你称号</div>
    <div class="title-badge ${E.cls}"><span>称号</span><b>${title}</b></div>
    <canvas class="scene" id="cvEnd" aria-label="${title}"></canvas>
    <p>${E.text(key==='mix'?0:s[key])}</p>
    <div class="bars">${row('仓库',s.wh,'var(--leaf)')}${row('摸鱼',s.slack,'var(--sky)')}${row('腹肌',s.abs,'var(--rose)')}</div>
    <button class="btn" id="again">再来七天</button></div>`;
  drawEnding($('cvEnd'),key);$('diaryBox').open=true;
  $('again').onclick=()=>{S=fresh();S.phase='choose';try{window.claude?.hot?.snapshot&&window.claude.hot.snapshot(()=>S)}catch(e){}render();focusFirst()};
}
function focusFirst(){const f=stage.querySelector('.choice,.btn');f&&f.focus({preventScroll:true});stage.scrollIntoView({block:'start'})}
try{if(matchMedia('(max-width:560px)').matches)$('diaryBox').open=false}catch(e){}
addEventListener('keydown',e=>{if(S.phase==='choose'&&['1','2','3'].includes(e.key)){const b=stage.querySelector(`.choice[data-i="${+e.key-1}"]`);b&&b.click()}});
render();
})();
</script>

</body>
</html>
